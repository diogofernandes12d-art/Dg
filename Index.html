
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RASPBR AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b16;color:white;
 font-family:Arial,sans-serif;padding:22px 16px;
}
header{text-align:center;padding:25px 0}
.logo{font-size:34px;font-weight:900;color:#a78bfa}
.sub{color:#aaa;font-size:13px}
main{max-width:520px;margin:auto}
.card{
 background:#15182a;border:1px solid #292d49;
 border-radius:18px;padding:20px;margin-bottom:16px
}
h2{font-size:19px}
label{display:block;margin:15px 0 8px;color:#ccc}
textarea,select{
 width:100%;padding:14px;border-radius:10px;
 background:#0d1020;color:white;
 border:1px solid #343956;font-size:15px
}
textarea{height:115px;resize:vertical}
button{
 width:100%;padding:16px;border:0;border-radius:12px;
 background:linear-gradient(90deg,#713cf5,#a855f7);
 color:white;font-size:16px;font-weight:bold;
 margin-top:18px;cursor:pointer
}
button:disabled{opacity:.5}
#result{
 margin-top:15px;background:#0d1020;
 border-radius:12px;padding:15px;color:#c4b5fd;
 display:none;line-height:1.5
}
.preview{
 height:155px;border-radius:12px;
 background:linear-gradient(135deg,#24205c,#10182c,#5b247a);
 display:flex;align-items:center;justify-content:center;
 font-size:45px;margin-top:15px
}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
 <div class="logo">✦ RASPBR AI</div>
 <p class="sub">Imagine. Create. Generate.</p>
</header>
<main>
 <section class="card">
  <h2>🎬 Criar vídeo com IA</h2>
  <label>Descreva seu vídeo</label>
  <textarea id="prompt" placeholder="Ex: Um dragão voando sobre uma cidade medieval, estilo cinematográfico..."></textarea>

  <label>Estilo do vídeo</label>
  <select id="style">
   <option>Realista</option>
   <option>Cinematográfico</option>
   <option>Anime</option>
   <option>Desenho animado</option>
   <option>Fantasia</option>
   <option>Futurista</option>
   <option>Terror</option>
   <option>3D</option>
  </select>

  <label>Formato</label>
  <select id="format">
   <option>Vertical 9:16</option>
   <option>Horizontal 16:9</option>
   <option>Quadrado 1:1</option>
  </select>

  <label>Duração desejada</label>
  <select id="duration">
   <option>5 segundos</option>
   <option>10 segundos</option>
   <option>15 segundos</option>
  </select>

  <button onclick="generate()">✨ GERAR MEU VÍDEO</button>
  <div id="result"></div>
 </section>

 <section class="card">
  <h2>🌟 Sua área de criação</h2>
  <div class="preview">▶️</div>
  <p class="sub">Seus vídeos gerados aparecerão aqui quando conectarmos o motor de IA.</p>
 </section>
</main>
<footer>RASPBR AI © 2026 · Criado por você</footer>
<script>
function generate(){
 const prompt=document.getElementById('prompt').value.trim();
 const result=document.getElementById('result');
 if(!prompt){
  alert('Escreva uma descrição para seu vídeo!');
  return;
 }
 const style=document.getElementById('style').value;
 const format=document.getElementById('format').value;
 const duration=document.getElementById('duration').value;
 result.style.display='block';
 result.innerHTML=
 '✅ Seu pedido foi preparado!<br><br>'+
 '<b>Descrição:</b> '+escapeHTML(prompt)+'<br>'+
 '<b>Estilo:</b> '+style+'<br>'+
 '<b>Formato:</b> '+format+'<br>'+
 '<b>Duração:</b> '+duration+
 '<br><br>🚧 Modo demonstração: o gerador de vídeo real será conectado na próxima etapa.';
}
function escapeHTML(s){
 return s.replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'}[c];
 });
}
</script>
</body>
</html>
